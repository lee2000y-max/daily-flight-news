name: Weekly crowd index (쏠림 지수)

# 매주 월요일 06:10 KST에 쏠림 지수(data/crowd_index.json)를 갱신한다.
# 인천공항 노선별 운송실적(공공데이터 파일, 키 없음) + 네이버 검색어 트렌드(Secrets가 있을 때만, 실행당 약 15회 호출).
on:
  schedule:
    - cron: '10 21 * * 0'   # 일요일 21:10 UTC = 월요일 06:10 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-flight-news
  cancel-in-progress: false

jobs:
  crowd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build crowd index
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python build_crowd.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/crowd_index.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Update crowd index"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

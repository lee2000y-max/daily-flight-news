name: Daily Flight News Collector
​on:
schedule:
- cron: '30 22 * * *'
workflow_dispatch:
​permissions:
contents: write
​jobs:
collect-and-publish:
runs-on: ubuntu-latest
timeout-minutes: 10
steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: Install packages
run: "python -m pip install --upgrade pip && pip install fast-flights google-genai"
​- name: Collect 58 flights
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
run: "python collect_flights.py"
​- name: Commit and push data
run: "git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com' && git add -A && (git diff --staged --quiet || (git commit -m 'Update flights data' && git pull --rebase origin main && git push))"
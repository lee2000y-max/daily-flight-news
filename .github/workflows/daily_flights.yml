name: Daily Flight News Collector & GitHub Pages Publisher
​on:
schedule:
- cron: '30 22 * * *'
workflow_dispatch:
​permissions:
contents: write
​jobs:
collect-and-publish:
runs-on: ubuntu-latest
timeout-minutes: 10
env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
​steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Set up Python 3.11
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: Install dependencies
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
pip install fast-flights google-genai
​- name: Collect 58 direct flights and update data
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
run: |
python collect_flights.py
​- name: Commit and push updated flights_data.json
run: |
git config --local user.email "github-actions[bot]@users.noreply.github.com"
git config --local user.name "github-actions[bot]"
git pull --rebase origin main || true
if [ -f flights_data.json ]; then git add flights_data.json; fi
git diff --staged --quiet || (git commit -m "Auto-update Daily Flight Briefing" && git push)
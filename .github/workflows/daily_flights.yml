name: Daily Flight News Collector & GitHub Pages Publisher
​on:
schedule:
# 매일 아침 한국시간(KST) 오전 07:30 정각 실행 (UTC 22:30)
- cron: '30 22 * * *'
workflow_dispatch: # GitHub Actions 탭에서 'Run workflow' 수동 실행 지원
​수집된 flights_data.json을 저장소에 자동 커밋/푸시하여 GitHub Pages 사이트를 즉시 갱신하기 위한 쓰기 권한
​permissions:
contents: write
​jobs:
collect-and-publish:
runs-on: ubuntu-latest
timeout-minutes: 10
env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
​steps:
- name: 1. 저장소 코드 체크아웃
uses: actions/checkout@v4
​- name: 2. Python 3.11 환경 설정
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: 3. 필수 패키지 설치 (requirements.txt 유무와 무관하게 안전 실행)
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
pip install fast-flights google-genai
​- name: 4. 58개 직항 도시 항공권 수집 및 구글 시트 + flights_data.json 갱신
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
run: |
python collect_flights.py
​- name: 5. GitHub Pages용 최신 데이터(flights_data.json) 자동 커밋 및 푸시
run: |
git config --local user.email "github-actions[bot]@users.noreply.github.com"
git config --local user.name "github-actions[bot]"
git pull --rebase origin main || true
if [ -f flights_data.json ]; then git add flights_data.json; fi
git diff --staged --quiet || (git commit -m "📰 Auto-update Daily Flight Briefing ($(date -u +'%Y-%m-%d'))" && git push)
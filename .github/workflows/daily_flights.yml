name: Daily Flight News Collector

on:
  schedule:
    - cron: '30 22 * * *'   # 매일 07:30 KST (GitHub cron은 UTC 기준)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-flight-news
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          # 실조회용(실패해도 이월 가격으로 계속 진행) / Gemini는 ENABLE_GEMINI_NOTES=1 일 때만 사용
          pip install "fast-flights==2.2" || echo "::warning::fast-flights 설치 실패 - 이월/기준가로 진행"
          pip install google-genai || echo "::warning::google-genai 설치 실패 - Gemini 노트 생략"

      - name: Collect 58 flights
        env:
          PYTHONUTF8: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
        run: python collect_flights.py

      - name: Commit and push data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add flights_data.json
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Update flights data"
            git pull --rebase origin main
            git push
          fi


name: Daily Flight News Collector

on:
  schedule:
    - cron: '30 22 * * *'   # 매일 07:30 KST (GitHub cron은 UTC 기준)
  workflow_dispatch:
    inputs:
      only_cities:
        description: '일부 도시만 수집(예: KIX,FUK). 비우면 전체'
        required: false
        default: ''
      dry_run:
        description: '1이면 저장·커밋하지 않고 결과만 출력'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: daily-flight-news
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          # flights==0.9.0: 구글 항공권 달력 API를 쓰는 마지막 판(0.10부터는 날짜마다 페이지 1개를 받아 매우 느림)
          # fast-flights·primp: 구글 항공권 링크(tfs) 생성용
          pip install "flights==0.9.0" "holidays>=0.50" "fast-flights==2.2" "primp==0.6.2"

      - name: Patch fli airport aliases
        run: |
          # fli 0.9.0은 영문 이름이 같은 공항을 하나로 합쳐 버려 오키나와(OKA)가 인도네시아 NAH로 조회됨
          F=$(python -c "import fli.models.airport as a; print(a.__file__)")
          sed -i 's/"OKA": "Naha Airport",/"OKA": "Naha Airport (Okinawa)",/' "$F"
          python - <<'PY'
          from fli.models import Airport
          import routes
          codes = set(routes.ORIGINS) | {a for c in routes.CITY_MASTER for a in c["airports"]}
          bad = [(c, Airport[c].name) for c in sorted(codes) if Airport[c].name != c]
          assert not bad, f"fli가 다른 공항으로 바꾸는 코드: {bad}"
          print("공항 코드 확인 완료:", len(codes), "개")
          PY

      - name: Collect flights
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'           # 중단돼도 진행 로그가 남도록
          FAIL_ON_LOW_LIVE: '1'           # 발행 도시가 절반 미만이면 이 단계를 실패로 표시(이메일 알림)
          ONLY_CITIES: ${{ github.event.inputs.only_cities }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python collect_flights.py

      - name: Commit and push data
        if: always() && github.event.inputs.dry_run != '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add flights_data.json data
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Update flights data and history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

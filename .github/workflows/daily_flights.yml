name: Daily Flight News Collector & GitHub Pages Publisher

on:
  schedule:
    # 매일 한국시간(KST) 오전 07:30 정각 실행 (UTC 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼으로 즉시 수동 실행 가능

# GitHub Actions 봇이 수집 결과를 저장소(GitHub Pages용 index.html, flights_data.json)에 자동 저장할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 58개 직항 도시 항공권 수집 및 구글 시트 + GitHub Pages 데이터 갱신
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
        run: |
          python collect_flights.py

      - name: GitHub Pages용 최신 데이터(index.html, flights_data.json) 자동 커밋 및 반영
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f flights_data.json ]; then git add flights_data.json; fi
          if [ -f index.html ]; then git add index.html; fi
          git diff --staged --quiet || git commit -m "📰 Auto-update Daily Flight Briefing ($(date -u +'%Y-%m-%d'))"
          git push


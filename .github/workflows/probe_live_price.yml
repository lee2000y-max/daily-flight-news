name: Probe live price (진단용, 수동 실행)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: A) fli 날짜 검색 실측
        continue-on-error: true
        run: |
          python -m venv vf
          vf/bin/pip install -q flights
          vf/bin/pip show flights | head -2
          vf/bin/python probe_calendar.py fli

      - name: B) 브라우저로 달력 가격 응답 캡처
        continue-on-error: true
        run: |
          python -m venv vb
          vb/bin/pip install -q "fast-flights==2.2" "primp==0.6.2" playwright
          vb/bin/python -m playwright install --with-deps chromium > /dev/null
          vb/bin/python probe_calendar.py browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe_out/

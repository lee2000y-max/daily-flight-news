name: Probe live price (진단용, 수동 실행)

on:
  workflow_dispatch:
    inputs:
      route:
        description: '진단할 도착 공항 코드'
        required: false
        default: 'OKA'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 노선 진단
        run: |
          pip install -q "flights==0.9.0" "fast-flights==2.2" "primp==0.6.2"
          python probe_route.py "${{ github.event.inputs.route }}"

name: Probe live price (진단용, 수동 실행)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: A2) fli 0.9.0 직항 필터·전수 소요 시간·상세 가격
        continue-on-error: true
        run: |
          python -m venv vf
          vf/bin/pip install -q "flights==0.9.0"
          vf/bin/python probe_calendar.py fli2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe_out/

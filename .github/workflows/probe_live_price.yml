name: Probe live price (진단용, 수동 실행)

on:
  workflow_dispatch:
    inputs:
      route:
        description: '진단할 도착 공항 코드(mode=route)'
        required: false
        default: 'OKA'
      mode:
        description: 'route(노선 진단) · site(화면 검증·스크린샷) · climate(기후 평년값 갱신·커밋) · booking(판매처별 가격 실험, route에 "ICN-YNT 2026-12-10 2026-12-16 ...") · photos(위키미디어 사진 후보 → preview/photos 브랜치, route에 "new"면 사진 없는 도시만) · photos_more(route의 도시만 다시 찾기, 예: "CTS KOJ") · pages_build(배포 묶음 시험, 배포 안 함) · photos_fetch(고른 사진 저장·커밋, route에 "YGJ:2 SDJ:1 ...") · drafts(현지 메모·제철 초안 → preview/drafts)'
        required: false
        default: 'route'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 화면 검증·스크린샷
        if: github.event.inputs.mode == 'site'
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium > /dev/null
          sudo apt-get -qq install -y fonts-noto-cjk > /dev/null
          python build_share.py          # 공유 페이지·썸네일(검사용, 이 브랜치에 커밋하지 않음)
          python build_extras.py         # 도시별 RSS·보관함 목록(검사용, 커밋하지 않음)
          rc=0; python check_site.py || rc=$?   # 실패해도 스크린샷은 올림(bash -e라 ; rc=$? 로는 바로 끝남)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan preview/screenshots
          git rm -rq --cached . > /dev/null
          git add -f screenshots
          git commit -qm "화면 검증 스크린샷 (${GITHUB_REF_NAME})"
          git push -qf origin HEAD:preview/screenshots
          exit $rc

      - name: 노선 진단
        if: github.event.inputs.mode == 'route' || github.event.inputs.mode == ''
        env:
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          pip install -q "flights==0.9.0" "fast-flights==2.2" "primp==0.6.2"
          python patch_fli.py
          # 입력 예: "OIT" 또는 "OIT 2026-12-30 2027-01-05" 또는 "GMP-HND 2026-12-04 2026-12-07"
          python probe_route.py $ROUTE

      - name: 기후 평년값 갱신(data/climate_normals.json 커밋)
        if: github.event.inputs.mode == 'climate'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python build_climate.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/climate_normals.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Update climate normals"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 판매처별 가격 실험(P3)
        if: github.event.inputs.mode == 'booking'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          pip install -q playwright "fast-flights==2.2" "primp==0.6.2"
          python -m playwright install --with-deps chromium > /dev/null
          rc=0; python probe_booking.py $ROUTE || rc=$?
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan preview/screenshots
          git rm -rq --cached . > /dev/null
          git add -f screenshots
          git commit -qm "판매처별 가격 실험 스크린샷 (${GITHUB_REF_NAME})"
          git push -qf origin HEAD:preview/screenshots
          exit $rc

      - name: 현지 메모·제철 초안(Gemini + 네이버 검색 근거 → preview/drafts 브랜치, 화면에는 안 실음)
        if: github.event.inputs.mode == 'drafts'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          # route에 new면 현지 메모가 빈 도시 전부, 도시 코드를 넣으면 그 도시만
          python build_drafts.py $ROUTE
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan preview/drafts
          git rm -rq --cached . > /dev/null
          git add -f data/drafts.json
          git commit -qm "현지 메모·제철 초안 (${GITHUB_REF_NAME})"
          git push -qf origin HEAD:preview/drafts

      - name: 위키미디어 사진 후보(preview/photos 브랜치에 올림)
        if: github.event.inputs.mode == 'photos'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          # route 비우면 전체 도시, "new"면 사진 없는 도시만(2026-11-05 추가 도시)
          python build_photos.py candidates $ROUTE
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan preview/photos
          git rm -rq --cached . > /dev/null
          git add -f photo_preview data/photo_candidates.json
          git commit -qm "위키미디어 사진 후보 (${GITHUB_REF_NAME})"
          git push -qf origin HEAD:preview/photos

      - name: 위키미디어 사진 다시 찾기(지정 도시, 기존 후보에 4번부터 덧붙여 preview/photos에 올림)
        if: github.event.inputs.mode == 'photos_more'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          git fetch -q origin preview/photos
          git checkout -q origin/preview/photos -- photo_preview data/photo_candidates.json
          git reset -q
          python build_photos.py candidates $ROUTE
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan preview/photos-new
          git rm -rq --cached . > /dev/null
          git add -f photo_preview data/photo_candidates.json
          git commit -qm "위키미디어 사진 후보 추가: $ROUTE"
          git push -qf origin HEAD:preview/photos

      - name: 고른 사진 저장(images/cities, data/photos.json 커밋)
        if: github.event.inputs.mode == 'photos_fetch'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          pip install -q pillow
          git fetch -q origin preview/photos
          git show origin/preview/photos:data/photo_candidates.json > data/photo_candidates.json
          python build_photos.py fetch "$ROUTE"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add images/cities data/photos.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Update city photos (Wikimedia Commons)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # pages.yml은 main에 올라가기 전에는 브랜치에서 수동 실행이 안 되므로(404), 같은 묶기 과정을 여기서 시험한다
      - name: 배포 묶음 시험(pages.yml build와 같은 과정, 배포 안 함)
        if: github.event.inputs.mode == 'pages_build'
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          sudo apt-get -qq update > /dev/null && sudo apt-get -qq install -y fonts-noto-cjk > /dev/null
          pip install -q pillow
          python build_share.py
          python build_extras.py
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '__pycache__' --exclude 'photo_preview' ./ _site/
          touch _site/.nojekyll
          echo "묶음: $(du -sh _site | cut -f1), 공유 페이지 $(ls _site/s | wc -l)개, 도시 사진 $(ls _site/images/cities | wc -l)장"
          test -f _site/index.html && test -f _site/flights_data.json && test -f _site/s/og.jpg && test -f _site/data/photos.json && test -f _site/data/archive.json && test -f _site/data/leadtime.json && test -f _site/feed/YGJ.xml
      - name: 배포 묶음 올리기 시험
        if: github.event.inputs.mode == 'pages_build'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
